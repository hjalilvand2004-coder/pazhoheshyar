name: "Release — ساخت بسته پرتیبل ویندوز"

# تریگر: پوش تگ v* یا اجرای دستی از تب Actions
# خروجی: zip بسته پرتیبل ویندوز (بدون نیاز به پایتون) در بخش Releases

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Portable (exe — no Python needed)
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        shell: pwsh
        run: python -m pip install -r backend/requirements.txt pytest --quiet

      - name: Run backend tests (sanity — non-blocking)
        working-directory: backend
        continue-on-error: true
        shell: pwsh
        run: python -m pytest tests -q

      - name: Build portable package (scripts\build_portable.bat)
        shell: cmd
        run: call scripts\build_portable.bat

      - name: Smoke test — run the exe for real on :8000
        shell: pwsh
        run: |
          $pkg = "dist\Pazhoheshyar360-Windows"
          $exe = Join-Path $pkg "pazhoheshyar360-server.exe"
          if (-not (Test-Path $exe)) { Write-Host "::error::exe not found: $exe"; exit 1 }
          $proc = Start-Process -FilePath $exe -WorkingDirectory $pkg -PassThru
          $ok = $false
          for ($i = 0; $i -lt 45; $i++) {
            Start-Sleep -Seconds 2
            if ($proc.HasExited) { Write-Host "Process exited early, code=$($proc.ExitCode)"; break }
            try {
              $r = Invoke-WebRequest -Uri "http://localhost:8000/api/v1/services" -UseBasicParsing -TimeoutSec 5
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch {}
          }
          Get-Process -Name "pazhoheshyar360-server" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          if (-not $ok) { Write-Host "::error::Smoke test failed — no 200 response on :8000"; exit 1 }
          Write-Host "Smoke test OK: GET /api/v1/services => 200"
          # داده‌های ناشی از تست دود را از بسته پاک می‌کنیم (zip قبل از این مرحله ساخته شده و دست‌نخورده است)
          if (Test-Path (Join-Path $pkg "data")) { Remove-Item (Join-Path $pkg "data") -Recurse -Force }

      - name: Rename zip with version tag
        shell: pwsh
        run: |
          $name = "Pazhoheshyar360-Windows.zip"
          if ("$env:GITHUB_REF_NAME" -like "v*") { $name = "Pazhoheshyar360-Windows-$env:GITHUB_REF_NAME.zip" }
          Copy-Item "dist\Pazhoheshyar360-Windows.zip" $name -Force
          "ASSET_NAME=$name" | Add-Content -Path $env:GITHUB_ENV -Encoding utf8
          Write-Host "Asset: $name"

      - name: Upload artifact (available from Actions tab)
        uses: actions/upload-artifact@v4
        with:
          name: Pazhoheshyar360-Windows-portable
          path: ${{ env.ASSET_NAME }}
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "پژوهشیار۳۶۰ ${{ github.ref_name }}"
          body_path: RELEASE-NOTES.md
          files: ${{ env.ASSET_NAME }}
          fail_on_unmatched_files: true

  build-linux:
    name: Build Linux Portable (binary — no Python needed)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: build-windows
    env:
      PYTHONUTF8: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt pytest --quiet

      - name: Run backend tests (sanity — non-blocking)
        working-directory: backend
        continue-on-error: true
        run: python -m pytest tests -q

      - name: Build portable package (scripts/build_portable.sh)
        run: bash scripts/build_portable.sh

      - name: Assemble Linux package
        run: |
          PKG=dist/Pazhoheshyar360-Linux
          rm -rf "$PKG" && mkdir -p "$PKG"
          cp backend/dist/pazhoheshyar360-server "$PKG/pazhoheshyar360-server"
          chmod +x "$PKG/pazhoheshyar360-server"
          cp scripts/START-LINUX.sh "$PKG/START-LINUX.sh"
          chmod +x "$PKG/START-LINUX.sh"
          cp README.md "$PKG/README.md"
          cat > "$PKG/راهنمای-اجرا.txt" <<'GUIDE'
          پژوهشیار۳۶۰ — نسخه اجرایی مستقل لینوکس
          ========================================
          ۱. پوشه Pazhoheshyar360-Linux را Extract کنید.
          ۲. اجرا:  bash START-LINUX.sh   یا   ./pazhoheshyar360-server
          ۳. در مرورگر آدرس http://localhost:8000 را باز کنید.
          ۴. حساب‌های آزمایشی: student1 / prof1 / manager1 / admin1 — رمز همه: 12345678
          ۵. تغییر پورت:  PORT=8080 bash START-LINUX.sh
          ۶. داده‌ها در پوشه data کنار همین فایل‌ها ذخیره می‌شود؛ برای انتقال کامل، کل پوشه را کپی کنید.
          GUIDE

      - name: Smoke test — run the binary for real on :8000
        run: |
          cd dist/Pazhoheshyar360-Linux
          nohup ./pazhoheshyar360-server > server.log 2>&1 &
          SRV=$!
          OK=0
          for i in $(seq 1 45); do
            sleep 2
            if curl -sf http://localhost:8000/api/v1/services > /dev/null; then OK=1; break; fi
          done
          kill "$SRV" 2>/dev/null || true
          sleep 1
          pkill -9 -x pazhoheshyar360-server 2>/dev/null || true
          if [ "$OK" != "1" ]; then
            echo "::error::Smoke test failed — no 200 response on :8000"
            tail -50 server.log || true
            exit 1
          fi
          echo "Smoke test OK: GET /api/v1/services => 200"
          rm -f server.log nohup.out
          rm -rf data

      - name: Zip package with version tag
        run: |
          NAME="Pazhoheshyar360-Linux.zip"
          if [[ "$GITHUB_REF_NAME" == v* ]]; then NAME="Pazhoheshyar360-Linux-$GITHUB_REF_NAME.zip"; fi
          (cd dist && zip -qry "$GITHUB_WORKSPACE/$NAME" Pazhoheshyar360-Linux)
          echo "ASSET_NAME=$NAME" >> "$GITHUB_ENV"
          echo "Asset: $NAME"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pazhoheshyar360-Linux-portable
          path: ${{ env.ASSET_NAME }}
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET_NAME }}
          fail_on_unmatched_files: true
