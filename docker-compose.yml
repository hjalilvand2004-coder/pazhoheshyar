services:
  pazhoheshyar360:
    build: .
    ports:
      - "8088:8088"
    environment:
      - PORT=8088
      # مقادیر جریان SSO مطابق clients.json/پنل پرتال دانشجویار۳۶۰ (استقرار تولیدی)
      - SSO_CLIENT_ID=pajouhyar360
      - SSO_REDIRECT_URI=http://188.212.96.235:8088/api/v1/auth/sso/callback
      - SSO_POST_LOGOUT_REDIRECT_URI=http://188.212.96.235:8088/?loggedOut=1
      # - SECRET_KEY=یک-مقدار-ثابت-تصادفی
      # - SERVICE_TOKEN=توکن-مشترک-سامانه‌های-دانشجو۳۶۰
    volumes:
      - pzh_data:/app/data
      - pzh_uploads:/app/uploads
volumes:
  pzh_data:
  pzh_uploads:
